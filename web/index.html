<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>통로암거 수량 산출</title>
<style>
/* 입력, 실행, 결과가 위에서 아래로 이어지는 단일 작업 화면. 도구이므로 장식 없이 상태 표시에만 색을 쓴다. */
:root{--bg:#f6f8fa;--paper:#fff;--ink:#16212c;--mute:#566575;--rule:#cfd8e1;--accent:#0f5c94;--err-bg:#fbe3d3;--err:#b23c0a;--warn-bg:#fff4dc;--warn:#b9770e}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--paper:#18222c;--ink:#e6edf3;--mute:#9fb0bf;--rule:#33414e;--accent:#7dbbe8;--err-bg:#47291a;--err:#ff9352;--warn-bg:#3a2e16;--warn:#e0a944;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
h1{font-size:28px;margin:0 0 6px;line-height:1.3}
h2{font-size:18px;margin:0 0 8px}
p{margin:6px 0}
.meta{color:var(--mute);font-size:14px}
section{background:var(--paper);border:1px solid var(--rule);padding:18px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=file]{display:block;max-width:100%;font:inherit;font-size:14px}
input[type=number]{width:100%;padding:6px 8px;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
button{font:inherit;font-weight:600;padding:10px 18px;background:var(--accent);color:var(--paper);border:0;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
a.btn{display:inline-block;padding:8px 14px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;margin:4px 8px 4px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{padding:12px 14px;border:1px solid var(--rule);overflow-wrap:anywhere}
.msg.err{background:var(--err-bg);border-color:var(--err)}
.msg.warn{background:var(--warn-bg);border-color:var(--warn)}
iframe{width:100%;height:80vh;border:1px solid var(--rule);background:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
<h1>통로암거 수량 산출</h1>
<p>도면(DXF)에서 치수를 읽어 수량을 계산하고, 원본 수량산출서(PDF)가 있으면 비교합니다.</p>
<p class="meta">계산은 이 브라우저 안에서 이루어집니다. 도면과 산출서는 서버로 전송되지 않습니다.</p>
</header>
<form id="form">
<section>
<h2>1. 파일</h2>
<label for="dxf">DXF 도면 (한 구조물의 도면 전체, 여러 개 선택)</label>
<input type="file" id="dxf" accept=".dxf" multiple required>
<label for="pdf">원본 수량산출서 PDF (선택)</label>
<input type="file" id="pdf" accept=".pdf">
</section>
<section style="margin-top:18px">
<h2>2. 도면에 없는 값 (가정값)</h2>
<p class="meta">도면에서 읽을 수 없는 값입니다. 근거를 확인해 입력해 주세요. 원본 값을 그대로 넣으면 그 값이 들어간 수량은 원본과 비교해도 검증이 되지 않습니다.</p>
<div class="grid">
<div><label for="c1">Block 1 수축이음 개소</label><input type="number" id="c1" min="0" step="1" required></div>
<div><label for="c2">Block 2 수축이음 개소</label><input type="number" id="c2" min="0" step="1" required></div>
<div><label for="c3">Block 3 수축이음 개소</label><input type="number" id="c3" min="0" step="1" required></div>
<div><label for="scaffold_offset">본체 비계 높이 공제 (m)</label><input type="number" id="scaffold_offset" min="0" step="any" required></div>
<div><label for="wing_scaffold_h">날개벽 비계 높이 (m)</label><input type="number" id="wing_scaffold_h" min="0" step="any" required></div>
<div><label for="wing_scaffold_side">날개벽 비계 측면 폭 (m)</label><input type="number" id="wing_scaffold_side" min="0" step="any" required></div>
<div><label for="wing_side_top">날개벽 유로폼 바깥 구간 폭 (m)</label><input type="number" id="wing_side_top" min="0" step="any" required></div>
<div><label for="pvc_length">PVC 1개 길이 (m)</label><input type="number" id="pvc_length" min="0" step="any" required></div>
</div>
</section>
<p style="margin-top:18px"><button type="submit" id="go">수량 산출</button></p>
</form>
<div class="msg" id="status" role="status" hidden></div>
<section id="result" hidden>
<h2>결과</h2>
<div class="msg warn" id="note" hidden></div>
<p id="downloads"></p>
<iframe id="view" title="수량산출서"></iframe>
</section>
</main>
<script>
var worker = null, busy = false;
var statusBox = document.getElementById('status'), go = document.getElementById('go');
function show(text, cls) { statusBox.hidden = false; statusBox.className = 'msg ' + (cls || ''); statusBox.textContent = text; }
function link(name, blob, label) {
  var a = document.createElement('a'); a.className = 'btn'; a.href = URL.createObjectURL(blob); a.download = name; a.textContent = label;
  document.getElementById('downloads').appendChild(a);
}
function finish(r) {
  busy = false; go.disabled = false;
  if (r.status !== 'success') { document.getElementById('result').hidden = true; show(r.message, 'err'); window.__result = r; return; }
  statusBox.hidden = true;
  var note = document.getElementById('note');
  note.hidden = r.original_status !== 'parse_failed';
  note.textContent = '원본 PDF와 비교하지 못했습니다. ' + (r.original_note || '') + ' 도면 산출 결과만 보여 드립니다.';
  document.getElementById('downloads').textContent = '';
  var html = new Blob([r.htmlText], { type: 'text/html;charset=utf-8' });
  link('수량산출서.html', html, '수량산출서 (HTML)');
  link('수량산출서.xlsx', new Blob([r.xlsxData], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), '수량산출서 (Excel)');
  link('수량산출서.json', new Blob([r.jsonText], { type: 'application/json' }), '계산 원본 (JSON)');
  document.getElementById('view').src = URL.createObjectURL(html);
  document.getElementById('result').hidden = false;
  window.__result = r;
}
// 화면 입력과 자동 시험이 함께 쓰는 실행 함수
window.runWith = async function (dxfFiles, pdfFile, assumptions) {
  if (busy) return;
  busy = true; go.disabled = true; document.getElementById('result').hidden = true;
  show('파일을 읽는 중입니다');
  var dxfs = await Promise.all([].map.call(dxfFiles, async function (f) { return { name: f.name.split(/[\\/]/).pop(), data: await f.arrayBuffer() }; }));
  var pdf = pdfFile ? { data: await pdfFile.arrayBuffer() } : null;
  if (!worker) {
    worker = new Worker('worker.js');
    worker.onmessage = function (e) {
      if (e.data.type === 'progress') show(e.data.text);
      else if (e.data.type === 'done') finish(e.data.result);
      else finish({ status: 'crash', message: '처리 중 예상하지 못한 오류가 났습니다. 입력이 지원 범위 밖이거나 프로그램 오류입니다. ' + e.data.text });
    };
    worker.onerror = function (e) { finish({ status: 'crash', message: '프로그램을 시작하지 못했습니다. 인터넷 연결을 확인해 주세요. ' + (e.message || '') }); };
  }
  worker.postMessage({ dxfs: dxfs, pdf: pdf, assumptions: assumptions }, dxfs.map(function (d) { return d.data; }).concat(pdf ? [pdf.data] : []));
};
document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = function (id) { return parseFloat(document.getElementById(id).value); };
  window.runWith(document.getElementById('dxf').files, document.getElementById('pdf').files[0] || null, {
    contraction_count: { B1: v('c1'), B2: v('c2'), B3: v('c3') }, scaffold_offset: v('scaffold_offset'), wing_scaffold_h: v('wing_scaffold_h'),
    wing_scaffold_side: v('wing_scaffold_side'), wing_side_top: v('wing_side_top'), pvc_length: v('pvc_length')
  });
});
</script>
</body>
</html>
